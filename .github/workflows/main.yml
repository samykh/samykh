name: Generate Snake

on:
  # S'exécute automatiquement toutes les 6 heures
  schedule:
    - cron: "0 */6 * * *"
  # Permet de l'exécuter manuellement pour tester
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: Platane/snk@v3
        with:
          # Ton nom d'utilisateur GitHub
          github_user_name: samykh
          outputs: dist/github-contribution-grid-snake.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          # Le nom de la branche où l'image sera stockée
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
